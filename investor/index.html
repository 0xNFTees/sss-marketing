                CircuitBoard: <g><rect x="2" y="2" width="20" height="20" rx="2" stroke="currentColor" strokeWidth="2" fill="none"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="M9 11v3h3" stroke="currentColor" strokeWidth="2" fill="none"/></g>,
                Wifi: <path d="M5 12.55a11 11 0 0 1 14 0M7.88 15.43a7 7 0 0 1 8.24 0M10.66 18.21a2.75 2.75 0 0 1 2.68 0" stroke="currentColor" strokeWidth="2" fill="none"/>,
                Sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z" stroke="currentColor" strokeWidth="2" fill="none"/>,
                Smile: <g><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/></g>,
                Stethoscope: <path d="M4.8 2.5A3.5 3.5 0 0 0 2 6v2.5A7.5 7.5 0 0 0 9.5 16h5a7.5 7.5 0 0 0 7.5-7.5V6a3.5 3.5 0 0 0-5.3-3M12 16v5M10 21h4" stroke="currentColor" strokeWidth="2" fill="none"/>,
                Cpu: <g><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" stroke="currentColor" strokeWidth="2" fill="none"/></g>,
                ChevronRight: <polyline points="9 18 15 12 9 6" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
                ArrowUpRight: <g><line x1="7" y1="17" x2="17" y2="7" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><polyline points="7 7 17 7 17 17" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></g>
            };

            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {paths[name] || <circle cx="12" cy="12" r="10"/>}
                </svg>

        };

        // ─────────────────────────────────────────────────────────────────────
        // FINANCIAL MODEL ENGINE DATA
        // ─────────────────────────────────────────────────────────────────────
        const CONFIG = {
            startClinics: 3,
            targetClinics: 100,
            horizonMonths: 24,
            networkSize: 500,
            mgmtFee: 449,
            mgmtCost: 149,
            setupFee: 499,
            setupCost: 320,
            lpFee: 999,
            lpCost: 750,
            stripe: 0.03,
            corpTax: 0.13,
            founderShare: 0.85,
            partnerShare: 0.15,
            swBase: 400,
            swMax: 1800,
            laborMax: 3000,
            laborThreshold: 50,
            injection: 30000
        };

        const SETUP_NET = CONFIG.setupFee - CONFIG.setupCost - (CONFIG.setupFee * CONFIG.stripe);
        const LP_NET = CONFIG.lpFee - CONFIG.lpCost - (CONFIG.lpFee * CONFIG.stripe);
        const RECURRING_GROSS = CONFIG.mgmtFee - CONFIG.mgmtCost;
        const RECURRING_NET = RECURRING_GROSS - (CONFIG.mgmtFee * CONFIG.stripe);
        const RECURRING_MARGIN = RECURRING_GROSS / CONFIG.mgmtFee;

        function clinicsAt(month) {
            const t = (month - 1) / (CONFIG.horizonMonths - 1);
            return CONFIG.startClinics + (CONFIG.targetClinics - CONFIG.startClinics) * t;
        }

        function monthMetrics(month) {
            const clinics = clinicsAt(month);
            const prevClinics = month === 1 ? CONFIG.startClinics : clinicsAt(month - 1);
            const newClinics = Math.max(0, clinics - prevClinics);

            const recurringProfit = clinics * RECURRING_NET;
            const setupProfit = newClinics * SETUP_NET;
            const lpProfit = (clinics * LP_NET) / 12;
            const grossProfit = recurringProfit + setupProfit + lpProfit;

            const software = CONFIG.swBase + (CONFIG.swMax - CONFIG.swBase) * Math.max(0, clinics - CONFIG.startClinics) / (CONFIG.targetClinics - CONFIG.startClinics);
            const labor = clinics <= CONFIG.laborThreshold ? 0 : CONFIG.laborMax * Math.min(1, (clinics - CONFIG.laborThreshold) / CONFIG.laborThreshold);
            const opex = software + labor;

            const ebt = grossProfit - opex;
            const tax = ebt > 0 ? ebt * CONFIG.corpTax : 0;
            const net = ebt - tax;

          return {
              month,
              clinics,
              newClinics,
              recurringProfit,
              setupProfit,
              lpProfit,
              grossProfit,
              software,
              labor,
              opex,
              ebt,
              tax,
              net,
              founder: net * CONFIG.founderShare,
              partner: net * CONFIG.partnerShare
          };
        }

        const SERIES = Array.from({ length: CONFIG.horizonMonths }, (_, i) => monthMetrics(i + 1));
        let runningPartner = 0;
        let runningVenture = 0;
        
        const SERIES_WITH_CUM = SERIES.map((row) => {
            runningPartner += row.partner;
            runningVenture += row.net;
            return { ...row, cumPartner: runningPartner, cumVenture: runningVenture };
        });

        const PARTNER_PAYBACK_MONTH = SERIES_WITH_CUM.find((r) => r.cumPartner >= CONFIG.injection)?.month ?? null;
        const VENTURE_BREAKEVEN_MONTH = SERIES_WITH_CUM.find((r) => r.cumVenture >= CONFIG.injection)?.month ?? null;
        const FINAL = SERIES_WITH_CUM[CONFIG.horizonMonths - 1];

        // ─────────────────────────────────────────────────────────────────────
        // FORMATTERS
        // ─────────────────────────────────────────────────────────────────────
        const fmtUSD = (v, opts = {}) => v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0, ...opts });
        const fmtUSDc = (v) => v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
        const fmtPct = (v, d = 1) => `${(v * 100).toLocaleString("en-US", { maximumFractionDigits: d })}%`;
        const fmtN = (v, d = 0) => v.toLocaleString("en-US", { maximumFractionDigits: d });

        // ─────────────────────────────────────────────────────────────────────
        // PRIMITIVES
        // ─────────────────────────────────────────────────────────────────────
        const Card = ({ children, className = "", glow = false }) => (

        const SectionLabel = ({ children, num }) => (

        const StatRow = ({ label, value, accent = "" }) => (

        // ─────────────────────────────────────────────────────────────────────
        // MASTER INTERACTION UI CONTAINER
        // ─────────────────────────────────────────────────────────────────────

                document.head.appendChild(link);

            return (
                <div className="min-h-screen w-full bg-slate-950 text-slate-200" style={{ fontFamily: "Manrope, ui-sans-serif, system-ui, sans-serif" }}>
                    <style>{`

                                linear-gradient(rgba(148,163,184,0.04) 1px, transparent 1px),

                    <header className="relative border-b border-slate-800/80 grid-bg">

                                        S³
                                    </div>

                                A <span className="text-sky-400">$30,000</span> position in the{" "}

                    <section className="relative border-b border-slate-900 overflow-hidden">

                                        </p>

                                        <div className="hidden lg:flex absolute -left-[3.4rem] top-1 w-7 h-7 rounded-full bg-slate-950 border border-slate-700 items-center justify-center mono text-[10px] text-sky-400 font-semibold">02</div>
                                        <div className="lg:hidden mono text-[10px] text-sky-400 mb-2">· 02 ·</div>
                                        <p className="text-xl lg:text-[1.6rem] text-slate-100 leading-snug font-medium tracking-tight">
                                            Sweat equity is mine, the system is <span className="text-slate-300 italic">white-labeled and passive</span>, and your clinics carry <span className="text-emerald-400 font-semibold">zero operational weight</span>.
                                        </p>

                                    <div className="relative">

                                        <div className="lg:hidden mono text-[10px] text-emerald-400 mb-2">· 03 ·</div>

                    <section className="mx-auto max-w-7xl px-6 py-20">

                        <div className="flex items-end justify-between mb-10 flex-wrap gap-6">

                                <SafeIcon name="Zap" className="w-3.5 h-3.5 text-sky-400" />

                        </div>

                        <Card className="p-8 lg:p-10" glow>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                                <LiveMetric icon="Building2" label="Clinic Count" value={fmtN(Math.round(m.clinics))} suffix="active" detail={`${fmtPct(m.clinics / CONFIG.networkSize, 1)} of 123Dentist`} tone="sky" />
                                <LiveMetric icon="TrendingUp" label="Total Net Profit" value={fmtUSD(m.net)} suffix="/ mo" detail={`EBT ${fmtUSD(m.ebt)} − tax ${fmtUSD(m.tax)}`} tone="emerald" />
                                <LiveMetric icon="Crown" label="Founder Div · 85%" value={fmtUSD(m.founder)} suffix="/ mo" detail="Post-tax take-home" tone="slate" />
                                <LiveMetric icon="Users" label="Partner Div · 15%" value={fmtUSD(m.partner)} suffix="/ mo" detail={`Annualized ${fmtUSD(m.partner * 12)}`} tone="emerald" accent />

                slate: "text-slate-200"

            return (

                </div>
            );
        }

        function Sparkline({ title, series, keyName, activeMonth, stroke, fill, format }) {
            const w = 600; const h = 110;
            const vals = series.map((r) => r[keyName]);
            const max = Math.max(...vals); const min = Math.min(...vals);
            const range = max - min || 1;
            
            const pts = series.map((r, i) => {
                const x = (i / (CONFIG.horizonMonths - 1)) * w;
                const y = h - ((r[keyName] - min) / range) * h;
                return [x, y];
            });
            
            const d = pts.map(([x, y], i) => (i === 0 ? `M ${x},${y}` : `L ${x},${y}`)).join(" ");
            const area = `M 0,${h} ${pts.map(([x, y]) => `L ${x},${y}`).join(" ")} L ${w},${h} Z`;
            const [ax, ay] = pts[activeMonth - 1] || [0, 0];

            return (
                <div>
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-[10px] uppercase tracking-[0.2em] text-slate-500">{title}</span>
                        <span className="mono text-xs text-slate-300">{format(series[activeMonth - 1][keyName])}</span>
                    </div>
                    <svg viewBox={`0 0 ${w} ${h + 10}`} className="w-full" preserveAspectRatio="none">
                        {[0.25, 0.5, 0.75].map((p) => (
                            <line key={p} x1="0" x2={w} y1={h * p} y2={h * p} stroke="#1e293b" strokeDasharray="2 4" strokeWidth="0.5" />
                        ))}
                        <path d={area} fill={fill} />
                        <path d={d} fill="none" stroke={stroke} strokeWidth="2" />
                        <line x1={ax} x2={ax} y1="0" y2={h} stroke={stroke} strokeDasharray="2 3" strokeWidth="1" opacity="0.4" />
                        <circle cx={ax} cy={ay} r="6" fill={stroke} opacity="0.25" />
                        <circle cx={ax} cy={ay} r="3.5" fill={stroke} />
                    </svg>
                </div>
            );
        }

            const segments = [
                { label: "Service COGS", value: 149, color: "#475569" },
                { label: "Stripe Fee", value: 13.47, color: "#64748b" },
                { label: "Gross Margin (pre-tax)", value: 286.53, color: "#10b981" }
            ];
            const total = CONFIG.mgmtFee;
            return (
                <div>
                    <div className="flex h-12 w-full rounded-lg overflow-hidden border border-slate-800">
                        {segments.map((s) => (
                            <div key={s.label} style={{ width: `${(s.value / total) * 100}%`, background: s.color }} className="relative group flex items-center justify-center text-[10px] text-slate-900 font-bold">
                                <span className="opacity-90 px-1 truncate">{fmtPct(s.value / total, 1)}</span>
                            </div>
                        ))}
                    </div>
                    <div className="grid grid-cols-3 gap-4 mt-4">
                        {segments.map((s) => (
                            <div key={s.label}>
                                <div className="flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full" style={{ background: s.color }} />
                                    <span className="text-[11px] uppercase tracking-wider text-slate-500">{s.label}</span>
                                </div>
                                <div className="mono text-lg text-slate-100 mt-1">{fmtUSDc(s.value)}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function PaybackChart() {
            const w = 800; const h = 280;
            const maxVal = Math.max(FINAL.cumPartner, CONFIG.injection * 1.5);
            
            const pts = SERIES_WITH_CUM.map((r, i) => {
                const x = (i / (CONFIG.horizonMonths - 1)) * w;
                const y = h - (r.cumPartner / maxVal) * h;
                return [x, y];
            });
            
            const d = pts.map(([x, y], i) => (i === 0 ? `M ${x},${y}` : `L ${x},${y}`)).join(" ");
            const area = `M 0,${h} ${pts.map(([x, y]) => `L ${x},${y}`).join(" ")} L ${w},${h} Z`;

            const breakevenIdx = PARTNER_PAYBACK_MONTH ? PARTNER_PAYBACK_MONTH - 1 : 0;
            const breakevenX = PARTNER_PAYBACK_MONTH ? (breakevenIdx / (CONFIG.horizonMonths - 1)) * w : 0;
            const breakevenY = PARTNER_PAYBACK_MONTH ? h - (SERIES_WITH_CUM[breakevenIdx]?.cumPartner / maxVal) * h : h;
            const injectionY = h - (CONFIG.injection / maxVal) * h;

            return (
                <div>
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-4 text-[11px] text-slate-400">
                            <span className="flex items-center gap-2">
                                <span className="w-3 h-0.5 bg-emerald-400" /> Cumulative Partner Dividend
                            </span>
                            <span className="flex items-center gap-2">
                                <span className="w-3 h-0 border-t border-dashed" style={{ borderColor: "#f59e0b" }} /> $30,000 Injection
                            </span>
                        </div>
                        <span className="mono text-[10px] text-slate-600">CAD · cumulative</span>
                    </div>
                    <svg viewBox={`0 0 ${w} ${h + 30}`} className="w-full" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="paybackFill" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0%" stopColor="#10b981" stopOpacity="0.4" />
                                <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
                            </linearGradient>
                        </defs>
                        {[0.25, 0.5, 0.75, 1].map((p) => (
                            <line key={p} x1="0" x2={w} y1={h * (1 - p)} y2={h * (1 - p)} stroke="#1e293b" strokeWidth="0.5" strokeDasharray="2 4" />
                        ))}
                        <line x1="0" x2={w} y1={injectionY} y2={injectionY} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="6 4" opacity="0.8" />
                        <text x="8" y={injectionY - 6} fill="#f59e0b" fontSize="11" fontFamily="JetBrains Mono">$30,000 injection</text>
                        <path d={area} fill="url(#paybackFill)" />
                        <path d={d} fill="none" stroke="#10b981" strokeWidth="2.5" />
                        {PARTNER_PAYBACK_MONTH && (
                            <g>
                                <circle cx={breakevenX} cy={breakevenY} r="8" fill="#10b981" opacity="0.25" />
                                <circle cx={breakevenX} cy={breakevenY} r="4" fill="#10b981" />
                                <line x1={breakevenX} x2={breakevenX} y1={breakevenY} y2={h} stroke="#10b981" strokeWidth="1" strokeDasharray="2 3" opacity="0.5" />
                                <text x={breakevenX + 10} y={breakevenY - 10} fill="#10b981" fontSize="12" fontWeight="600" fontFamily="Manrope">Payback · M{PARTNER_PAYBACK_MONTH}</text>
                            </g>
                        )}
                        {[1, 6, 12, 18, 24].map((mm) => {
                            const xx = ((mm - 1) / (CONFIG.horizonMonths - 1)) * w;
                            return (
                                <g key={mm}>
                                    <line x1={xx} x2={xx} y1={h} y2={h + 4} stroke="#475569" />
                                    <text x={xx} y={h + 18} fill="#64748b" fontSize="10" textAnchor="middle" fontFamily="JetBrains Mono">M{mm}</text>
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        }

        function UpsellCard({ icon, tier, name, ticket, note, metrics, featured }) {
            return (
                <div className={`relative rounded-xl p-7 border ${featured ? "border-sky-500/40 bg-gradient-to-b from-sky-950/30 to-slate-900/60" : "border-slate-800 bg-slate-900/40"}`}>
                    {featured && <div className="absolute -top-3 left-7 px-2.5 py-0.5 bg-sky-500 text-slate-950 text-[10px] uppercase tracking-wider font-bold rounded">Highest LTV</div>}
                    <div className="flex items-center justify-between mb-5">
                        <div className="w-11 h-11 rounded-lg bg-slate-800/80 border border-slate-700 flex items-center justify-center">
                            <SafeIcon name={icon} className="w-5 h-5 text-sky-400" />
                        </div>
                        <span className="mono text-[10px] uppercase tracking-wider text-slate-500">{tier}</span>
                    </div>
                    <div className="text-xl font-bold text-slate-50">{name}</div>
                    <div className="mono text-sm text-emerald-400 mt-1">{ticket}</div>
                    <p className="text-[13px] text-slate-400 mt-3 leading-snug">{note}</p>
                    <div className="mt-5 space-y-0">{metrics.map(([k, v]) => <StatRow key={k} label={k} value={v} />)}</div>
                    <div className="mt-5 flex items-center gap-1.5 text-[11px] text-sky-400 group cursor-default">
                        Roadmap Q3 2027 <SafeIcon name="ChevronRight" className="w-3.5 h-3.5 inline ml-1 align-baseline" />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SSSEquityDashboard />);
    </script>
</body>
</html>
