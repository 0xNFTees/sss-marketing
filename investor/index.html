<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSS Marketing — Investor Pitch</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #020617;
      font-family: 'Manrope', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(148,163,184,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .num-glow {
      text-shadow: 0 0 24px rgba(14,165,233,0.25);
    }

    .profit-glow {
      text-shadow: 0 0 24px rgba(16,185,129,0.3);
    }

    input[type=range].sss-slider {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      width: 100%;
    }

    input[type=range].sss-slider::-webkit-slider-runnable-track {
      height: 4px;
      background: linear-gradient(
        90deg,
        #0ea5e9 0%,
        #0ea5e9 var(--val,50%),
        #1e293b var(--val,50%),
        #1e293b 100%
      );
      border-radius: 999px;
    }

    input[type=range].sss-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #f8fafc;
      border: 3px solid #0ea5e9;
      margin-top: -9px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      TrendingUp,
      Building2,
      Users,
      Crown,
      Briefcase,
      Zap
    } = lucide.icons;

    const { useState } = React;

    const CONFIG = {
      startClinics: 3,
      targetClinics: 100,
      horizonMonths: 24,
      networkSize: 500,
      mgmtFee: 449,
      mgmtCost: 149,
      stripe: 0.03,
      corpTax: 0.13,
      founderShare: 0.85,
      partnerShare: 0.15,
      injection: 30000,
    };

    const RECURRING_GROSS = CONFIG.mgmtFee - CONFIG.mgmtCost;
    const RECURRING_NET = RECURRING_GROSS - CONFIG.mgmtFee * CONFIG.stripe;

    function clinicsAt(month) {
      const t = (month - 1) / (CONFIG.horizonMonths - 1);
      return CONFIG.startClinics +
        (CONFIG.targetClinics - CONFIG.startClinics) * t;
    }

    function monthMetrics(month) {
      const clinics = clinicsAt(month);
      const recurringProfit = clinics * RECURRING_NET;
      const tax = recurringProfit * CONFIG.corpTax;
      const net = recurringProfit - tax;

      return {
        month,
        clinics,
        net,
        founder: net * CONFIG.founderShare,
        partner: net * CONFIG.partnerShare,
      };
    }

    const SERIES = Array.from(
      { length: CONFIG.horizonMonths },
      (_, i) => monthMetrics(i + 1)
    );

    function fmtUSD(v) {
      return v.toLocaleString('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0,
      });
    }

    function fmtN(v) {
      return v.toLocaleString('en-US', {
        maximumFractionDigits: 0,
      });
    }

    function Icon({ icon: IconComp, className }) {
      return React.createElement(IconComp, {
        className,
        strokeWidth: 2,
      });
    } className={className}></i>;
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-2xl border border-slate-800 bg-slate-900/60 ${className}`}>
          {children}
        </div>
      );
    }

    function Metric({ icon, label, value, detail, accent }) {
      return (
        <Card className={`p-5 ${accent ? 'border-emerald-500/30 bg-emerald-500/5' : ''}`}>
          <div className="flex items-center justify-between mb-4">
            <div className="text-[10px] uppercase tracking-[0.2em] text-slate-500">
              {label}
            </div>
            <Icon icon={icon} className="w-4 h-4 text-sky-400" />
          </div>

          <div className={`mono text-3xl font-bold ${accent ? 'text-emerald-400 profit-glow' : 'text-slate-100'}`}>
            {value}
          </div>

          <div className="text-[11px] text-slate-500 mt-2">
            {detail}
          </div>
        </Card>
      );
    }

    function App() {
      const [month, setMonth] = useState(12);

      const m = SERIES[month - 1];

      React.useEffect(() => {}, [month]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-200">
          <header className="border-b border-slate-800 grid-bg">
            <div className="max-w-7xl mx-auto px-6 py-6">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center text-white font-bold">
                    S³
                  </div>

                  <div>
                    <div className="font-bold text-slate-100">
                      SSS MARKETING
                    </div>

                    <div className="mono text-[10px] uppercase tracking-[0.2em] text-slate-500">
                      Capital Partners
                    </div>
                  </div>
                </div>

                <div className="mono text-[11px] text-slate-500">
                  Rev. 05.2026
                </div>
              </div>

              <div className="mt-16 max-w-4xl">
                <div className="flex items-center gap-2 text-sky-400 text-[11px] uppercase tracking-[0.25em] mb-5">
                  <Icon icon={Briefcase} className="w-4 h-4" />
                  Partner Equity Dashboard
                </div>

                <h1 className="text-5xl lg:text-6xl font-extrabold tracking-tight leading-[1.05] text-slate-50">
                  A <span className="text-sky-400">$30,000</span> position in the utility layer of Canadian dental care.
                </h1>

                <p className="mt-6 text-slate-400 text-lg leading-relaxed max-w-2xl">
                  Partner subscribes for a 15% perpetual net-profit equity in SSS Marketing's clinic-services platform.
                </p>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-20">
            <div className="flex items-end justify-between mb-10 flex-wrap gap-6">
              <div>
                <div className="text-[11px] uppercase tracking-[0.2em] text-sky-400 mb-3">
                  Growth Strategy
                </div>

                <h2 className="text-4xl font-bold tracking-tight text-slate-50">
                  Drag the lever. Watch the yield curve.
                </h2>

                <p className="text-slate-500 mt-3 max-w-xl">
                  Real-time model simulation for clinic expansion.
                </p>
              </div>

              <div className="flex items-center gap-2 text-[11px] uppercase tracking-wider text-slate-400">
                <Icon icon={Zap} className="w-4 h-4 text-sky-400" />
                Live Scenario Engine
              </div>
            </div>

            <Card className="p-8">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-10">
                <Metric
                  icon={Building2}
                  label="Clinic Count"
                  value={fmtN(Math.round(m.clinics))}
                  detail="Active clinics"
                />

                <Metric
                  icon={TrendingUp}
                  label="Net Profit"
                  value={fmtUSD(m.net)}
                  detail="Monthly"
                  accent
                />

                <Metric
                  icon={Crown}
                  label="Founder 85%"
                  value={fmtUSD(m.founder)}
                  detail="Monthly dividend"
                />

                <Metric
                  icon={Users}
                  label="Partner 15%"
                  value={fmtUSD(m.partner)}
                  detail="Monthly dividend"
                  accent
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-4">
                  <div>
                    <div className="text-[10px] uppercase tracking-[0.2em] text-slate-500">
                      Timeline Position
                    </div>

                    <div className="mono text-3xl text-slate-50 mt-1">
                      Month {month}
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="text-[10px] uppercase tracking-[0.2em] text-slate-500">
                      Penetration
                    </div>

                    <div className="mono text-xl text-sky-400">
                      {Math.round((m.clinics / CONFIG.networkSize) * 100)}%
                    </div>
                  </div>
                </div>

                <input
                  type="range"
                  min="1"
                  max="24"
                  value={month}
                  onChange={(e) => setMonth(Number(e.target.value))}
                  className="sss-slider"
                  style={{
                    '--val': `${((month - 1) / 23) * 100}%`
                  }}
                />
              </div>
            </Card>

            <div className="grid lg:grid-cols-4 gap-5 mt-10">
              <Card className="p-6 lg:col-span-2">
                <div className="text-[10px] uppercase tracking-[0.2em] text-slate-500 mb-3">
                  Deal Terms
                </div>

                <div className="space-y-4">
                  <div className="flex justify-between border-b border-slate-800 pb-3">
                    <span className="text-slate-400">Capital Injection</span>
                    <span className="mono text-slate-100">$30,000</span>
                  </div>

                  <div className="flex justify-between border-b border-slate-800 pb-3">
                    <span className="text-slate-400">Partner Equity</span>
                    <span className="mono text-emerald-400">15%</span>
                  </div>

                  <div className="flex justify-between border-b border-slate-800 pb-3">
                    <span className="text-slate-400">Target Clinics</span>
                    <span className="mono text-slate-100">100</span>
                  </div>

                  <div className="flex justify-between">
                    <span className="text-slate-400">Network Size</span>
                    <span className="mono text-slate-100">500</span>
                  </div>
                </div>
              </Card>

              <Card className="p-6 lg:col-span-2 border-emerald-500/30 bg-emerald-500/5">
                <div className="text-[10px] uppercase tracking-[0.2em] text-emerald-400 mb-3">
                  Monthly Partner Yield
                </div>

                <div className="mono text-6xl font-bold text-emerald-400 profit-glow">
                  {fmtUSD(m.partner)}
                </div>

                <div className="mt-3 text-slate-400">
                  Projected monthly partner dividend at Month {month}
                </div>
              </Card>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
```
