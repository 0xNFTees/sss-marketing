<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SSS Investor Dashboard</title>
  <meta name="description" content="Secret investor dashboard for SSS Marketing." />
  <style>
    :root { color-scheme: dark; }
    html,body{margin:0;background:#020817;color:#e2e8f0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    #root{min-height:100vh}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    (async function(){
      // load React and lucide icons
      const ReactMod = await import('https://esm.sh/react@18.3.1');
      const React = ReactMod.default;
      const { createRoot } = await import('https://esm.sh/react-dom@18.3.1/client');
      const lucide = await import('https://esm.sh/lucide-react@0.370.0');

      // fetch the authoritative JSX file
      const resp = await fetch('./investor.jsx');
      if(!resp.ok){
        document.getElementById('root').textContent = 'Failed to load investor.jsx';
        return;
      }
      let src = await resp.text();

      // remove top-level imports for React and lucide-react
      src = src.replace(/import\s+React[\s\S]*?from\s+["']react["'];?\n/, '');
      src = src.replace(/import\s+\{[\s\S]*?\}\s+from\s+["']lucide-react["'];?\n/, '');

      // prepend bindings so transformed code has React and icon names in scope
      const iconNames = ['TrendingUp','Building2','Users','Receipt','Layers','Wifi','ShieldCheck','Sparkles','ArrowUpRight','ChevronRight','Crown','Briefcase','Activity','Target','Lock','Zap','Stethoscope','Smile','CircuitBoard','Cpu','DollarSign','CalendarClock'];
      const iconsBind = 'const lucideModule = await import("https://esm.sh/lucide-react@0.370.0");\nconst { ' + iconNames.join(',') + ' } = lucideModule;\n';
      const prelude = 'const React = (await import("https://esm.sh/react@18.3.1")).default;\nconst createRoot = (await import("https://esm.sh/react-dom@18.3.1/client")).createRoot;\n' + iconsBind;

      const full = prelude + '\n' + src;

      // transpile JSX to browser JS
      const transformed = Babel.transform(full, { presets:['react'] }).code;

      // import as module via blob
      const blob = new Blob([transformed], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      try{
        const mod = await import(url);
        const Dashboard = mod.default || mod.SSSEquityDashboard || window.SSSEquityDashboard;
        if(!Dashboard){
          document.getElementById('root').textContent = 'Dashboard module did not export default';
          return;
        }
        createRoot(document.getElementById('root')).render(React.createElement(Dashboard));
      }catch(err){
        console.error(err);
        document.getElementById('root').textContent = 'Error rendering dashboard: '+err.message;
      }
    })();
  </script>
</body>
</html>
