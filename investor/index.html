<!DOCTYPE html>
<html lang="en">
<head>

  <title>SSS Investor Dashboard</title>
  <meta name="description" content="Secret investor dashboard for SSS Marketing.">
  <link rel="canonical" href="https://sss.marketing/investor/">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #020817; color: #e2e8f0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

    #root { min-height: 100vh; }
    .flex { display: flex; }

    .text-slate-300 { color: #cbd5e1; }

    .text-slate-600 { color: #475569; }

    .max-w-7xl { max-width: 112rem; }

    .p-5 { padding: 1.25rem; }

    .mt-10 { margin-top: 2.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-5 { margin-bottom: 1.25rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-10 { margin-bottom: 2.5rem; }

    .text-[10px], .text-xs { font-size: 0.75rem; }

    .text-3xl { font-size: 1.875rem; }

    .h-px { height: 1px; }
    .w-7 { width: 1.75rem; }
    .w-11 { width: 2.75rem; }
    .h-11 { height: 2.75rem; }
    .w-10 { width: 2.5rem; }
    .h-10 { height: 2.5rem; }
    .w-3\.5 { width: 0.875rem; }
    .h-3\.5 { height: 0.875rem; }
    .border-slate-800 { border-color: #334155; }
    .bg-slate-950 { background: #020718; }
    .bg-slate-900\/60 { background: rgba(15, 23, 42, 0.6); }
    .bg-slate-900\/40 { background: rgba(15, 23, 42, 0.4); }
    .bg-emerald-500\/5 { background: rgba(16, 185, 129, 0.05); }
    .bg-gradient-to-br { background: linear-gradient(135deg, rgba(14, 165, 233, 0.6), rgba(14, 165, 233, 0.2)); }
    .shadow-[0_0_30px_-6px_rgba\(14,165,233,0.6\)] { box-shadow: 0 0 30px -6px rgba(14, 165, 233, 0.6); }
    .shadow-[0_0_40px_-12px_rgba\(14,165,233,0.35\)] { box-shadow: 0 0 40px -12px rgba(14, 165, 233, 0.35); }

<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import {
      TrendingUp,
      Building2,
      Users,
      Receipt,
      Layers,
      Wifi,
      ShieldCheck,
      Sparkles,
      ArrowUpRight,
      ChevronRight,
      Crown,
      Briefcase,
      Activity,
      Target,
      Lock,
      Zap,
      Stethoscope,
      Smile,
      CircuitBoard,
      Cpu,
      DollarSign,
      CalendarClock,
    } from "https://esm.sh/lucide-react@0.370.0";

    const CONFIG = {
      startClinics: 3,
      targetClinics: 100,
      horizonMonths: 24,
      networkSize: 500,
      mgmtFee: 449,
      mgmtCost: 149,
      setupFee: 499,
      setupCost: 320,
      lpFee: 999,
      lpCost: 750,
      stripe: 0.03,
      corpTax: 0.13,
      founderShare: 0.85,
      partnerShare: 0.15,
      swBase: 400,
      swMax: 1800,
      laborMax: 3000,
      laborThreshold: 50,
      injection: 30000,
    };

    const SETUP_NET = CONFIG.setupFee - CONFIG.setupCost - CONFIG.setupFee * CONFIG.stripe;
    const LP_NET = CONFIG.lpFee - CONFIG.lpCost - CONFIG.lpFee * CONFIG.stripe;
    const RECURRING_GROSS = CONFIG.mgmtFee - CONFIG.mgmtCost;
    const RECURRING_NET = RECURRING_GROSS - CONFIG.mgmtFee * CONFIG.stripe;
    const RECURRING_MARGIN = RECURRING_GROSS / CONFIG.mgmtFee;

    function clinicsAt(month) {
      const t = (month - 1) / (CONFIG.horizonMonths - 1);
      return CONFIG.startClinics + (CONFIG.targetClinics - CONFIG.startClinics) * t;
    }

    function monthMetrics(month) {
      const clinics = clinicsAt(month);
      const prevClinics = month === 1 ? CONFIG.startClinics : clinicsAt(month - 1);
      const newClinics = Math.max(0, clinics - prevClinics);
      const recurringProfit = clinics * RECURRING_NET;
      const setupProfit = newClinics * SETUP_NET;
      const lpProfit = (clinics * LP_NET) / 12;
      const grossProfit = recurringProfit + setupProfit + lpProfit;
      const software =
        CONFIG.swBase +
        (CONFIG.swMax - CONFIG.swBase) *
          Math.max(0, clinics - CONFIG.startClinics) /
          (CONFIG.targetClinics - CONFIG.startClinics);
      const labor =
        clinics <= CONFIG.laborThreshold
          ? 0
          : CONFIG.laborMax *
            Math.min(1, (clinics - CONFIG.laborThreshold) / CONFIG.laborThreshold);
      const opex = software + labor;
      const ebt = grossProfit - opex;
      const tax = ebt > 0 ? ebt * CONFIG.corpTax : 0;
      const net = ebt - tax;

      return {
        month,
        clinics,
        newClinics,
        recurringProfit,
        setupProfit,
        lpProfit,
        grossProfit,
        software,
        labor,
        opex,
        ebt,
        tax,
        net,
        founder: net * CONFIG.founderShare,
        partner: net * CONFIG.partnerShare,
      };
    }

    const SERIES = Array.from({ length: CONFIG.horizonMonths }, (_, i) =>
      monthMetrics(i + 1)
    );
    let runningPartner = 0;
    let runningVenture = 0;
    const SERIES_WITH_CUM = SERIES.map((row) => {
      runningPartner += row.partner;
      runningVenture += row.net;
      return { ...row, cumPartner: runningPartner, cumVenture: runningVenture };
    });

    const PARTNER_PAYBACK_MONTH =
      SERIES_WITH_CUM.find((r) => r.cumPartner >= CONFIG.injection)?.month ?? null;
    const VENTURE_BREAKEVEN_MONTH =
      SERIES_WITH_CUM.find((r) => r.cumVenture >= CONFIG.injection)?.month ?? null;
    const FINAL = SERIES_WITH_CUM[CONFIG.horizonMonths - 1];

    const fmtUSD = (v, opts = {}) =>
      v.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0,
        ...opts,
      });
    const fmtUSDc = (v) =>
      v.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2,
      });
    const fmtPct = (v, d = 1) =>
      `${(v * 100).toLocaleString("en-US", { maximumFractionDigits: d })}%`;
    const fmtN = (v, d = 0) =>
      v.toLocaleString("en-US", { maximumFractionDigits: d });

    const Card = ({ children, className = "", glow = false }) => (
      React.createElement(
        "div",
        {
          className:
            `relative rounded-xl border border-slate-800 bg-slate-900/60 backdrop-blur-sm ${
              glow ? "shadow-[0_0_40px_-12px_rgba(14,165,233,0.35)]" : ""
            } ${className}`,
        },
        children
      )
    );

    const SectionLabel = ({ children, num }) => (
      React.createElement(
        "div",
        { className: "mb-6 flex items-center gap-3" },
        React.createElement(
          "span",
          { className: "font-mono text-[11px] tracking-[0.2em] text-sky-500/80" },
          num
        ),
        React.createElement("span", { className: "h-px flex-none w-8 bg-slate-700" }),
        React.createElement(
          "span",
          { className: "font-mono text-[11px] tracking-[0.25em] uppercase text-slate-400" },
          children
        )
      )
    );

    const StatRow = ({ label, value, accent = "" }) => (
      React.createElement(
        "div",
        { className: "flex items-baseline justify-between border-b border-slate-800/60 py-2.5 last:border-b-0" },
        React.createElement(
          "span",
          { className: "text-[11px] uppercase tracking-wider text-slate-500" },
          label
        ),
        React.createElement(
          "span",
          { className: `font-mono text-sm tabular-nums ${accent || "text-slate-200"}` },
          value
        )
      )
    );

    function LiveMetric({ icon: Icon, label, value, suffix, detail, tone, accent }) {
      const toneMap = {
        sky: "text-sky-400 num-glow",
        emerald: "text-emerald-400 profit-glow",
        slate: "text-slate-200",
      };
      return React.createElement(
        "div",
        {
          className: `relative p-5 rounded-lg border ${
            accent
              ? "bg-emerald-500/5 border-emerald-500/30"
              : "bg-slate-950/60 border-slate-800"
          } transition-all`,
        },
        React.createElement(
          "div",
          { className: "flex items-center justify-between mb-4" },
          React.createElement(
            "span",
            { className: "text-[10px] uppercase tracking-[0.2em] text-slate-500" },
            label
          ),
          React.createElement(Icon, { className: `w-3.5 h-3.5 ${toneMap[tone]}` })
        ),
        React.createElement(
          "div",
          { className: "flex items-baseline gap-1.5" },
          React.createElement(
            "span",
            { className: `mono text-3xl font-bold tabular-nums leading-none ${toneMap[tone]}` },
            value
          ),
          React.createElement(
            "span",
            { className: "text-xs text-slate-500" },
            suffix
          )
        ),
        React.createElement(
          "div",
          { className: "text-[11px] text-slate-500 mt-2 leading-tight" },
          detail
        )
      );
    }

    function Sparkline({ title, series, keyName, activeMonth, stroke, fill, format }) {
      const w = 600;
      const h = 110;
      const vals = series.map((r) => r[keyName]);
      const max = Math.max(...vals);
      const min = Math.min(...vals);
      const range = max - min || 1;
      const pts = series.map((r, i) => {
        const x = (i / (CONFIG.horizonMonths - 1)) * w;
        const y = h - ((r[keyName] - min) / range) * h;
        return [x, y];
      });
      const d = pts
        .map(([x, y], i) => (i === 0 ? `M ${x},${y}` : `L ${x},${y}`))
        .join(" ");
      const area = `M 0,${h} ${pts.map(([x, y]) => `L ${x},${y}`).join(" ")} L ${w},${h} Z`;
      const [ax, ay] = pts[activeMonth - 1];

      return React.createElement(
        "div",
        null,
        React.createElement(
          "div",
          { className: "flex items-center justify-between mb-3" },
          React.createElement(
            "span",
            { className: "text-[10px] uppercase tracking-[0.2em] text-slate-500" },
            title
          ),
          React.createElement(
            "span",
            { className: "mono text-xs text-slate-300" },
            format(series[activeMonth - 1][keyName])
          )
        ),
        React.createElement(
          "svg",
          { viewBox: `0 0 ${w} ${h + 10}`, className: "w-full", preserveAspectRatio: "none" },
          [0.25, 0.5, 0.75].map((p) =>
            React.createElement("line", {
              key: p,
              x1: 0,
              x2: w,
              y1: h * p,
              y2: h * p,
              stroke: "#1e293b",
              strokeDasharray: "2 4",
              strokeWidth: 0.5,
            })
          ),
          React.createElement("path", { d: area, fill }),
          React.createElement("path", {
            d,
            fill: "none",
            stroke,
            strokeWidth: 2,
          }),
          React.createElement("line", {
            x1: ax,
            x2: ax,
            y1: 0,
            y2: h,
            stroke,
            strokeDasharray: "2 3",
            strokeWidth: 1,
            opacity: 0.4,
          }),
          React.createElement("circle", { cx: ax, cy: ay, r: 6, fill: stroke, opacity: 0.25 }),
          React.createElement("circle", { cx: ax, cy: ay, r: 3.5, fill: stroke })
        )
      );
    }

    function MarginStack() {
      const segments = [
        { label: "Service COGS", value: 149, color: "#475569" },
        { label: "Stripe Fee", value: 13.47, color: "#64748b" },
        { label: "Gross Margin (pre-tax)", value: 286.53, color: "#10b981" },
      ];
      const total = CONFIG.mgmtFee;
      return React.createElement(
        "div",
        null,
        React.createElement(
          "div",
          {
            className: "flex h-12 w-full rounded-lg overflow-hidden border border-slate-800",
            style: { display: "flex" },
          },
          segments.map((s) =>
            React.createElement(
              "div",
              {
                key: s.label,
                style: {
                  width: `${(s.value / total) * 100}%`,
                  background: s.color,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                },
                className: "relative group text-[10px] text-slate-900 font-bold",
              },
              React.createElement("span", { className: "opacity-90 px-1 truncate" }, fmtPct(s.value / total, 1))
            )
          )
        ),
        React.createElement(
          "div",
          { className: "grid grid-cols-3 gap-4 mt-4" },
          segments.map((s) =>
            React.createElement(
              "div",
              { key: s.label },
              React.createElement(
                "div",
                { className: "flex items-center gap-2" },
                React.createElement("span", { className: "w-2 h-2 rounded-full", style: { background: s.color, display: "inline-block" } }),
                React.createElement(
                  "span",
                  { className: "text-[11px] uppercase tracking-wider text-slate-500" },
                  s.label
                )
              ),
              React.createElement(
                "div",
                { className: "mono text-lg text-slate-100 mt-1" },
                fmtUSDc(s.value)
              )
            )
          )
        )
      );
    }

    function PaybackChart() {
      const w = 800;
      const h = 280;
      const maxVal = Math.max(FINAL.cumPartner, CONFIG.injection * 1.5);
      const pts = SERIES_WITH_CUM.map((r, i) => {
        const x = (i / (CONFIG.horizonMonths - 1)) * w;
        const y = h - (r.cumPartner / maxVal) * h;
        return [x, y];
      });
      const d = pts
        .map(([x, y], i) => (i === 0 ? `M ${x},${y}` : `L ${x},${y}`))
        .join(" ");
      const area = `M 0,${h} ${pts.map(([x, y]) => `L ${x},${y}`).join(" ")} L ${w},${h} Z`;
      const breakevenIdx = PARTNER_PAYBACK_MONTH - 1;
      const breakevenX = (breakevenIdx / (CONFIG.horizonMonths - 1)) * w;
      const breakevenY = h - (SERIES_WITH_CUM[breakevenIdx].cumPartner / maxVal) * h;
      const injectionY = h - (CONFIG.injection / maxVal) * h;

      return React.createElement(
        "div",
        null,
        React.createElement(
          "div",
          { className: "flex items-center justify-between mb-4" },
          React.createElement(
            "div",
            { className: "flex items-center gap-4 text-[11px] text-slate-400" },
            React.createElement(
              "span",
              { className: "flex items-center gap-2" },
              React.createElement("span", {
                className: "w-3 h-0.5 bg-emerald-400",
                style: { display: "inline-block", height: "0.125rem", backgroundColor: "#34d399" },
              }),
              "Cumulative Partner Dividend"
            ),
            React.createElement(
              "span",
              { className: "flex items-center gap-2" },
              React.createElement("span", {
                className: "w-3 h-0 border-t border-dashed",
                style: { display: "inline-block", width: "0.75rem", borderTop: "1px dashed #f59e0b" },
              }),
              "$30,000 Injection"
            )
          ),
          React.createElement(
            "span",
            { className: "mono text-[10px] text-slate-600" },
            "CAD · cumulative"
          )
        ),
        React.createElement(
          "svg",
          { viewBox: `0 0 ${w} ${h + 30}`, className: "w-full", preserveAspectRatio: "none" },
          React.createElement("defs", null,
            React.createElement("linearGradient", { id: "paybackFill", x1: "0", x2: "0", y1: "0", y2: "1" },
              React.createElement("stop", { offset: "0%", stopColor: "#10b981", stopOpacity: "0.4" }),
              React.createElement("stop", { offset: "100%", stopColor: "#10b981", stopOpacity: "0" })
            )
          ),
          [0.25, 0.5, 0.75, 1].map((p) =>
            React.createElement("line", {
              key: p,
              x1: 0,
              x2: w,
              y1: h * (1 - p),
              y2: h * (1 - p),
              stroke: "#1e293b",
              strokeWidth: 0.5,
              strokeDasharray: "2 4",
            })
          ),
          React.createElement("line", {
            x1: 0,
            x2: w,
            y1: injectionY,
            y2: injectionY,
            stroke: "#f59e0b",
            strokeWidth: 1.5,
            strokeDasharray: "6 4",
            opacity: 0.8,
          }),
          React.createElement("text", {
            x: 8,
            y: injectionY - 6,
            fill: "#f59e0b",
            fontSize: 11,
            fontFamily: "JetBrains Mono",
          }, "$30,000 injection"),
          React.createElement("path", { d: area, fill: "url(#paybackFill)" }),
          React.createElement("path", { d, fill: "none", stroke: "#10b981", strokeWidth: 2.5 }),
          React.createElement("circle", { cx: breakevenX, cy: breakevenY, r: 8, fill: "#10b981", opacity: 0.25 }),
          React.createElement("circle", { cx: breakevenX, cy: breakevenY, r: 4, fill: "#10b981" }),
          React.createElement("line", {
            x1: breakevenX,
            x2: breakevenX,
            y1: breakevenY,
            y2: h,
            stroke: "#10b981",
            strokeWidth: 1,
            strokeDasharray: "2 3",
            opacity: 0.5,
          }),
          React.createElement("text", {
            x: breakevenX + 10,
            y: breakevenY - 10,
            fill: "#10b981",
            fontSize: 12,
            fontWeight: 600,
            fontFamily: "Manrope",
          }, `Payback · M${PARTNER_PAYBACK_MONTH}`),
          [1, 6, 12, 18, 24].map((mm) => {
            const xx = ((mm - 1) / (CONFIG.horizonMonths - 1)) * w;
            return React.createElement("g", { key: mm },
              React.createElement("line", {
                x1: xx,
                x2: xx,
                y1: h,
                y2: h + 4,
                stroke: "#475569",
              }),
              React.createElement("text", {
                x: xx,
                y: h + 18,
                fill: "#64748b",
                fontSize: 10,
                textAnchor: "middle",
                fontFamily: "JetBrains Mono",
              }, `M${mm}`)
            );
          })
        )
      );
    }

    function UpsellCard({ icon: Icon, tier, name, ticket, note, metrics, featured }) {
      return React.createElement(
        "div",
        {
          className: `relative rounded-xl p-7 border ${
            featured
              ? "border-sky-500/40 bg-gradient-to-b from-sky-950/30 to-slate-900/60"
              : "border-slate-800 bg-slate-900/40"
          }`,
        },
        featured &&
          React.createElement(
