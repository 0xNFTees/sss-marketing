<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Prospects | SSS</title>
<script src="/crm/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* SSS Prospects v2. A work tool, not a website: a left rail, one working surface, a drawer for the lead.
   Palette and type from SSS Pillar 3 (paper, sage, tan, ink; Newsreader + Hanken Grotesk). */
:root{
  color-scheme: light;
  --paper:#fefae0; --card:#fffdf3; --surface-a:#e9edc9; --surface-b:#faedcd; --sage:#ccd5ae; --sage-deep:#5b6b34;
  --tan:#d4a373; --tan-hover:#c99560; --tan-deep:#875320; --ink:#1c1812; --ink-2:rgba(28,24,18,.66); --ink-3:rgba(28,24,18,.46);
  --line:rgba(28,24,18,.12); --line-2:rgba(28,24,18,.2); --alert:#a4451f; --alert-bg:#f7e2d4;
  --display:"Newsreader","Iowan Old Style",Georgia,serif; --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-sm:7px; --rail:232px; --shadow:0 1px 0 rgba(28,24,18,.04),0 8px 24px -12px rgba(28,24,18,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.caps{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.soft{color:var(--ink-2)} .faint{color:var(--ink-3)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;border-right:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:15px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:20px;line-height:1}
.brand span{display:block;font-size:12px;color:var(--ink-2)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);text-decoration:none;font-weight:500;color:var(--ink-2)}
.nav a:hover{background:var(--surface-b);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav a .count{margin-left:auto;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--line)}
.nav a[aria-current="page"] .count{background:rgba(254,250,224,.18)}
.nav a .count.hot{background:var(--alert);color:#fff}
.rail-foot{margin-top:auto;display:grid;gap:10px;padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--card)}
.seg button{padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.main{min-width:0;padding:28px 36px 120px}
.page{max-width:1180px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--display);font-weight:500;font-size:38px;line-height:1.02;letter-spacing:-.02em;margin:4px 0 0}
.page-head .caps{color:var(--tan-deep)}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.mtop{display:none}
.tabbar{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .12s,background-color .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--tan);border-color:var(--tan);color:var(--ink)}
.btn.primary:hover{background:var(--tan-hover);border-color:var(--tan-hover)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-b);border-color:transparent}
.btn.danger{color:var(--alert);border-color:rgba(164,69,31,.4)}
.btn.small{min-height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:999px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-b);color:var(--ink)}
input[type=search],input[type=text],input[type=password],input[type=date],input[type=email],input[type=tel],input[type=url],select,textarea{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;min-height:40px;width:100%}
select{width:auto;padding-right:28px}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(212,163,115,.25)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);margin:0;cursor:pointer}
label.f{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2)}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-weight:400;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;background:var(--card);transition:background-color .15s,border-color .15s,transform .12s}
.chip:hover{border-color:var(--ink)}
.chip:active{transform:scale(.97)}
.chip b{font-weight:600;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:rgba(254,250,224,.7)}
.chip[aria-pressed="true"] .kbd{color:inherit;border-color:rgba(254,250,224,.45)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1 1 260px;position:relative}
.toolbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toolbar .search input{padding-left:34px}
.spacer{flex:1}
.kbd{font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--ink-3);font-weight:600}

/* ---------- cards, pills ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--line-2);white-space:nowrap;background:var(--card)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.s-new{color:var(--ink-2)}
.s-contacted{color:#6b5a2a;background:#f5efd4;border-color:#e6dcb4}
.s-talking{color:var(--tan-deep);background:var(--surface-b);border-color:#ecd3ab}
.s-meeting{color:var(--sage-deep);background:var(--surface-a);border-color:var(--sage)}
.s-proposal{color:#3e4a22;background:var(--sage);border-color:#b6c191}
.s-won{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.s-later{color:var(--ink-3);border-style:dashed}
.s-lost{color:var(--ink-3);text-decoration:line-through}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--alert-bg);color:var(--alert)}
.tag.ok{background:var(--surface-a);color:var(--sage-deep)}
.tag.net{background:#efe6f0;background:#e8e2d3;color:#5a4d36}
.due{font-weight:600;color:var(--tan-deep);white-space:nowrap}
.due.late{color:var(--alert)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-weight:500;font-size:22px;color:var(--ink);margin-bottom:4px}
.notice{background:var(--surface-b);border:1px solid #ecd3ab;border-radius:var(--r-sm);padding:10px 14px;font-size:14px;margin:0 0 14px}
.notice.warn{background:var(--alert-bg);border-color:rgba(164,69,31,.25);color:#6e2c10}

/* ---------- today ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:14px 16px;text-align:left;display:grid;gap:2px;transition:transform .12s,border-color .15s}
button.stat:hover{transform:translateY(-2px);border-color:var(--line-2)}
.stat .n{font-family:var(--display);font-size:40px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .n small{font-size:18px;color:var(--ink-3)}
.stat.alert .n{color:var(--alert)}
.stat .caps{color:var(--ink-2)}
.section{margin-bottom:26px}
.section-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.section-head h2{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.01em;margin:0}
.section-head .count{font-size:13px;color:var(--ink-3);font-weight:600}
.queue{overflow:hidden}
.qrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 250px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.queue.calls .qrow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 410px}
.qrow:hover{background:#fffbea}
.qrow .who{min-width:0;text-align:left}
.qrow .who b{display:block;font-family:var(--display);font-weight:500;font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .who span{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .what{font-size:13.5px;min-width:0}
.qrow .what .due{display:block;font-size:12px;margin-bottom:1px}
.qrow .act{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.phone-big{font-family:var(--display);font-size:19px;font-weight:500;text-decoration:none;white-space:nowrap}
.phone-big:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- pipeline list ---------- */
.table{overflow:hidden}
.thead,.trow{display:grid;grid-template-columns:34px minmax(0,2fr) minmax(0,1.2fr) 128px 96px minmax(0,1.4fr);gap:12px;align-items:center;padding:0 14px}
.thead{min-height:40px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.trow{min-height:58px;border-top:1px solid var(--line);cursor:pointer}
.trow:first-of-type{border-top:0}
.trow:hover{background:#fffbea}
.trow.sel{background:var(--surface-a)}
.trow .c1 b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c1 span,.trow .c2 span{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c2 b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c5{font-size:13px;color:var(--ink-2)}
.trow .c6{font-size:13px;min-width:0}
.trow .c6 .nx{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.more{display:flex;justify-content:center;padding:14px}
.bulk{position:sticky;bottom:18px;z-index:5;margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px 10px 18px;background:var(--ink);color:var(--paper);border-radius:999px;box-shadow:0 12px 30px -10px rgba(28,24,18,.5)}
.bulk b{font-weight:600;margin-right:6px}
.bulk select{background:#2c2720;color:var(--paper);border-color:rgba(254,250,224,.25);min-height:34px;padding:4px 26px 4px 10px;font-size:13.5px}
.bulk .btn{min-height:34px;background:transparent;color:var(--paper);border-color:rgba(254,250,224,.3)}
.bulk .btn:hover{border-color:var(--paper)}
.bulk .btn.primary{background:var(--tan);color:var(--ink);border-color:var(--tan)}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:rgba(233,237,201,.45);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px;transition:background-color .15s}
.col.over{background:var(--surface-a);border-color:var(--sage-deep)}
.col h3{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px;font-size:13px;font-weight:600}
.col h3 span{color:var(--ink-3)}
.bcard{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 rgba(28,24,18,.04);transition:transform .12s,box-shadow .15s}
.bcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bcard b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.bcard span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.bcard .meta{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;flex-wrap:wrap}
.bcard.dragging{opacity:.4}

/* ---------- directory ---------- */
.dir-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.filters{padding:16px;display:grid;gap:16px;position:sticky;top:20px}
.filters h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.check{display:flex;align-items:flex-start;gap:9px;font-size:14px;cursor:pointer;min-height:28px;padding:3px 0}
.check input{flex:none;margin-top:1px}
.prov{display:flex;flex-wrap:wrap;gap:6px}
.drow{display:grid;grid-template-columns:34px minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);min-height:58px}
.drow:first-of-type{border-top:0}
.drow:hover{background:#fffbea}
.drow.sel{background:var(--surface-a)}
.drow.in{opacity:.55}
.drow b{display:block;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow span{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .have{display:flex;gap:4px;flex-wrap:wrap}

/* ---------- sequences ---------- */
.seqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.seq{padding:18px}
.seq h3{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 2px}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.steps li .d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-a);font-size:12px;font-weight:700;color:var(--sage-deep)}
.steps li .d.call{background:var(--surface-b);color:var(--tan-deep)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,24,18,.28);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--paper);z-index:21;overflow-y:auto;box-shadow:-20px 0 50px -20px rgba(28,24,18,.35);transform:translateX(24px);opacity:0;transition:transform .22s cubic-bezier(.2,.7,.2,1),opacity .18s}
.drawer.on{transform:none;opacity:1}
.dhead{position:sticky;top:0;z-index:2;background:var(--paper);padding:14px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead .t{flex:1;min-width:0}
.dhead .caps{color:var(--tan-deep);display:block}
.dhead h2{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.08;letter-spacing:-.015em;margin:3px 0 2px;overflow-wrap:anywhere}
.dhead p{margin:0;color:var(--ink-2);font-size:14px}
.dbody{padding:4px 22px 80px}
.blk{padding:16px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk > .caps{display:flex;align-items:center;gap:8px;color:var(--ink-3);margin-bottom:10px}
.reach{display:grid;gap:8px}
.reach-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:36px}
.reach-row .lbl{width:22px;color:var(--ink-3);display:grid;place-items:center}
.reach-row a{overflow-wrap:anywhere}
.say{background:var(--surface-a);border-radius:var(--r-sm);padding:14px 16px;font-size:14.5px}
.say p{margin:0 0 8px} .say p:last-child{margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.box.tint{background:var(--surface-b);border-color:#ecd3ab}
.box.sage{background:var(--surface-a);border-color:var(--sage)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.timeline li{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14px}
.timeline .when{color:var(--ink-3);font-size:12.5px}
.timeline b{font-weight:600}
.progress{display:flex;gap:4px;margin-top:6px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--sage-deep)}
.progress i.now{background:var(--tan)}
details.more-details summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
details.more-details summary::-webkit-details-marker{display:none}
.grid-form{display:grid;gap:10px;margin-top:12px}

/* ---------- modal & call mode ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(28,24,18,.35)}
.modal .card{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;background:var(--paper)}
.modal h2{font-family:var(--display);font-weight:500;font-size:28px;margin:0 0 4px}
.callmode{position:fixed;inset:0;z-index:25;background:var(--paper);overflow-y:auto}
.callmode .inner{max-width:760px;margin:0 auto;padding:20px 22px 60px}
.callbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.callbar .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.callbar .bar i{display:block;height:100%;background:var(--tan);transition:width .3s}
.callmode h2{font-family:var(--display);font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:4px 0}
.callmode .phone-xl{display:inline-block;font-family:var(--display);font-size:44px;font-weight:500;text-decoration:none;margin:8px 0 4px;letter-spacing:-.01em}
.outcomes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.outcomes .chip{justify-content:center;min-height:46px;border-radius:var(--r-sm);font-size:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(28,24,18,.6)}

/* ---------- login, account ---------- */
.gate{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px}
.gate .card{width:min(420px,100%);padding:28px;display:grid;gap:14px}
.gate h1{font-family:var(--display);font-weight:500;font-size:34px;letter-spacing:-.02em;margin:0}
.gate .err{color:var(--alert);font-size:14px;margin:0}

function runPool(items,worker,onProgress,width){
  width=width||3;var i=0,done=0,errs=0;

    function next(){

  var d=addDays(+s.steps[n].d||0,start);
  var min=afterEmail?addDays(2):today();
  return d<min?min:d;
}
function seqPatchAdvance(l,afterEmail){
  var s=seqOf(l);if(!s)return {};
  var n=(+l.step||0)+1;
  if(n>=s.steps.length)return {seq:'',step:0,drafted:'',next:'Sequence finished: decide on a call or Not now',due:addDays(7)};
  return {step:n,drafted:'',due:dueForStep(l,n,afterEmail),next:s.steps[n].name+' · '+s.name};
}
function mySeqs(){return state.seqs.filter(function(s){return !s.voice||s.voice===state.me;});}
function startSeqPatch(l,k,startDate){
  var s=null;state.seqs.forEach(function(x){if(x.k===k)s=x;});if(!s)return {};
  var st=startDate||today();
  return {seq:k,step:0,seqStart:st,drafted:'',due:st,next:s.steps[0].name+' · '+s.name};
}
function article(name,lang){
  if(lang!=='FR')return name;
  if(/^(centre|cabinet|groupe|bureau)\b/i.test(name))return 'le '+name;
  if(/^(clinique|polyclinique)\b/i.test(name))return 'la '+name;
  return name;
}
function defaultGreet(l){
  var lang=langOf(l);
  var docs=(l.contact||'').split(/;|,| et | and /).map(function(x){return x.trim();}).filter(function(x){return /^(dr|dre|dr\.)\s/i.test(x);});
  if(docs.length===1||docs.length===2){
    var names=docs.map(function(x){var p=x.replace(/\(.*?\)/g,'').trim().split(/\s+/);return p[0].replace(/\.$/,'')+' '+p[p.length-1];});
    return names.join(lang==='FR'?' et ':' and ');
  }
  if(lang==='FR'){var a=article(titleOf(l),'FR');return "à l'équipe "+(/^le /.test(a)?'du '+a.slice(3):/^la /.test(a)?'de '+a:/^[aeiouhéèêà]/i.test(a)?"d'"+a:'de '+a);}
  return titleOf(l)+' team';
}
function isTeamGreet(g){return /^à l'équipe|team$/i.test(g||'');}
function mergeEmail(l){
  var s=seqOf(l),st=stepOf(l);if(!s||!st||st.ch!=='email')return null;
  var lang=s.lang||langOf(l);var g=l.greet||defaultGreet(l);
  var clinic=titleOf(l);
  function fill(t){
    return String(t||'')
      .replace(/\{Salutation\}/g,g)
      .replace(/\{Clinique\}/g,article(clinic,lang))
      .replace(/\{Clinic\}/g,clinic)
      .replace(/^.*\{Perso\}.*$\n?/m,l.perso?l.perso+'\n':'')
      .replace(/^.*\{Forward\}.*$\n?/m,isTeamGreet(g)?FORWARD[lang]+'\n':'');
  }
  var body=fill(st.body).replace(/\{Moi\}/g,firstName(state.me)).replace(/\n{3,}/g,'\n\n').trim();
  body+='\n\n'+(state.meFull||state.me)+'\n'+SIG[lang]+(s.optout?'\n'+SIG['OPT_'+lang]:'');
  return {to:l.email||'',subject:fill(st.subj),body:body,cold:s.kind==='cold'};
}
function gmailHref(m){
  var u='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(m.to)+'&su='+encodeURIComponent(m.subject)+'&body='+encodeURIComponent(m.body);
  if(state.meEmail)u+='&authuser='+encodeURIComponent(state.meEmail);

}
/* problems that block or should slow an email */
function emailChecks(l,m){
  var out=[];
  if(l.dnc)out.push({stop:true,t:'This clinic asked not to be contacted. Do not email.'});
  if(!l.email)out.push({stop:true,t:'No email address on file.'});
  if(!l.consent)out.push({stop:true,t:'Confirm the address on the clinic’s own website first (CASL proof), then record it below.'});
  var t=lastEmailTs(l.id);if(t&&Date.now()-t<48*3600e3)out.push({t:'The last email went out less than 48 hours ago.'});
  if(m&&m.cold&&coldSentToday()>=COLD_CAP)out.push({t:'Already '+coldSentToday()+' cold emails today. The mailbox is new: keep it to '+COLD_CAP+' a day.'});
  return out;
}

function pMatches(l){
  var p=state.p;
  if(p.stage==='open'){if(!isOpen(l))return false;}
  else if(p.stage==='due'){if(!isDue(l))return false;}
  else if(p.stage!=='all'&&l.stage!==p.stage)return false;
  if(p.owner&&l.owner!==p.owner)return false;
  if(p.type&&l.type!==p.type)return false;
  if(p.prov&&(l.prov||'')!==p.prov)return false;
  if(p.seq==='_none'&&l.seq)return false;
  if(p.seq&&p.seq!=='_none'&&l.seq!==p.seq)return false;
  if(p.flag==='noemail'&&l.email)return false;
  if(p.flag==='nophone'&&firstPhone(l.phone))return false;
  if(p.flag==='noproof'&&(!l.email||l.consent))return false;
  if(p.flag==='nocontact'&&l.contact)return false;
  if(p.flag==='dr'&&!l.dr)return false;
  if(p.q){
    var hay=norm([l.clinic,l.contact,l.role,l.city,l.address,l.phone,l.email,l.web,l.notes,l.id].join(' '));
    var words=norm(p.q).split(' ');
    for(var i=0;i<words.length;i++)if(hay.indexOf(words[i])<0)return false;
  }
  return true;
}
function stageRank(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i].k===k)return i;return 99;}
function pSort(a,b){
  var ad=isDue(a),bd=isDue(b);if(ad!==bd)return ad?-1:1;
  var ax=a.due||'9999',bx=b.due||'9999';if(ax!==bx)return ax<bx?-1:1;
  var r=stageRank(b.stage)-stageRank(a.stage);if(r&&state.p.stage!=='all')return 0;
  return a.id<b.id?1:-1;
}

function boardHtml(rows){

function bulkApply(kind,val){

/* Sync: pull DentRefer through the viewer's Supabase connector, chunk by province into pool/<PROV>-<n> */
var SB_PROJECT='pqdzoaaukavkuqwzhqev',CHUNK=450;
function sbRows(query){
  return mcp.callTool('Supabase','execute_sql',{project_id:SB_PROJECT,query:query},{cache:false}).then(function(r){
    var p=r&&r.payload;var txt=typeof p==='string'?p:(p&&typeof p.result==='string'?p.result:JSON.stringify(p));
    var a=txt.indexOf('\n['),b=txt.lastIndexOf(']');
    if(a<0||b<0){var j=txt.indexOf('[');a=j;}
    return JSON.parse(txt.slice(a,b+1).trim());
  });
}
function syncPool(){
  if(!mcp||!db||state.syncing)return;
  state.syncing='Counting clinics…';render();
  var counts={},total=0,written=[];
  sbRows("select province as p, count(*)::int as n from public.directory_clinics where province is not null group by 1 order by 2 desc").then(function(rows){
    rows.forEach(function(r){counts[r.p]=r.n;total+=r.n;});
    var jobs=[];Object.keys(counts).forEach(function(p){for(var o=0;o<counts[p];o+=CHUNK)jobs.push({p:p,o:o,i:o/CHUNK});});
    var k=0;
    function step(){
      if(k>=jobs.length)return Promise.resolve();
      var j=jobs[k++];state.syncing='Syncing '+j.p+' ('+k+' of '+jobs.length+')';render();
      var q="select coalesce(json_agg(json_build_array(id,name,coalesce(street,''),coalesce(city,''),province,coalesce(postal_code,''),coalesce(phone,''),coalesce(email,''),coalesce(website,''),coalesce(net,''),case when is_specialist then coalesce(specialty,'Specialist') else '' end,left(coalesce(confidence,''),1),coalesce(array_to_string(practitioners,'; '),''))),'[]'::json) as rows from (select * from public.directory_clinics where province='"+j.p.replace(/[^A-Z]/g,'')+"' order by id limit "+CHUNK+" offset "+j.o+") c";
      return sbRows(q).then(function(r){
        var arr=r&&r[0]&&r[0].rows;if(typeof arr==='string')arr=JSON.parse(arr);
        var id=j.p+'-'+j.i;written.push(id);
        return db.doc('pool/'+id).set({prov:j.p,i:j.i,rows:arr||[],synced:today()});
      }).then(function(){return sleep(250);}).then(step);
    }
    return step();
  }).then(function(){
    return db.collection('pool').get().then(function(s){
      var stale=s.docs.filter(function(d){return written.indexOf(d.id)<0;});
      return runPool(stale,function(d){return db.doc('pool/'+d.id).delete();});
    });
  }).then(function(){
    var meta={provs:counts,total:total,synced:today(),by:state.me};
    return db.doc('config/pool').set(meta).then(function(){state.poolMeta=meta;state.pool={};});
  }).then(function(){state.syncing=null;toast('Directory synced: '+total.toLocaleString('en-CA')+' clinics.');render();},function(e){
    state.syncing=null;render();
    var c=e&&e.code;
    if(c==='server_not_connected')toast('Add the Supabase connector in claude.ai Settings, then try again.');
    else if(c==='needs_reauth')toast('Reconnect Supabase in claude.ai Settings → Connectors, then try again.');
    else if(c==='not_in_manifest'||c==='approval_required')toast('Sync needs your OK to use Supabase from this page. Try again and allow it.');
    else toast('The sync stopped part way. Run it again; it picks up cleanly.');
  });
}

    '</div><p class="faint" style="font-size:12px;margin:0">'+esc(l.id)+(l.added?' · added '+esc(niceDate(l.added)):'')+(l.dr?' · DentRefer '+esc(l.dr):'')+'</p></div></details></div>';

function lbl0(k){for(var i=0;i<OUTCOMES.length;i++)if(OUTCOMES[i].k===k)return OUTCOMES[i];}

/* compose */
function composeHtml(l){
  var m=state.dr.mail||mergeEmail(l);state.dr.mail=m;
  var checks=emailChecks(l,m),stop=checks.some(function(c){return c.stop;});
  var h='<div class="box" style="margin-top:12px">'+checks.map(function(c){return '<p class="notice'+(c.stop?' warn':'')+'" style="margin:0">'+esc(c.t)+'</p>';}).join('')+

    '<div class="row-actions">'+
      (mcp?'<button type="button" class="btn primary" data-act="draft-one"'+(stop?' disabled':'')+'>'+ic('i-mail')+'Save as Gmail draft</button>':'')+
      '<a class="btn'+(mcp?'':' primary')+'" href="'+(stop?'#':esc(gmailHref(m)))+'" target="_blank" rel="noopener"'+(stop?' aria-disabled="true" style="opacity:.45;pointer-events:none"':'')+'>Open in Gmail</a>'+

function markSent(id){
  var l=lead(id);if(!l)return;
  var s=seqOf(l),st=stepOf(l),cold=!!(s&&s.kind==='cold');
  var note=(st?st.name:'Email')+(s?' · '+s.name:'')+(state.dr.mail&&state.dr.mail.subject?' · « '+state.dr.mail.subject+' »':'');
  var patch=Object.assign({last:today(),stage:stageAfter(l.stage,'email_sent'),drafted:''},s?seqPatchAdvance(l,true):{});
  addLog({lead:l.id,outcome:'email_sent',note:note,cold:cold});
  state.dr.compose=false;state.dr.mail=null;
  return save(l.id,patch).then(function(){toast('Logged. '+(patch.due?'Next step '+dueLabel(patch.due).toLowerCase()+'.':''));rerender();});
}
function createDraft(l,m){
  return mcp.callTool('Gmail','create_draft',{to:[m.to],subject:m.subject,body:m.body},{cache:false}).then(function(){
    return save(l.id,{drafted:today()});
  });
}
function draftOne(){
  var l=lead(state.open);if(!l||!mcp)return;
  var m=readMail();
  var b=$('[data-act="draft-one"]');if(b){b.disabled=true;b.textContent='Saving draft…';}
  createDraft(l,m).then(function(){state.dr.compose=false;state.dr.mail=null;toast('Draft saved in Gmail. Send it there, then press Mark sent.');rerender();},function(e){mcpFail(e,'Gmail');renderDrawer();});
}
function draftAll(){
  if(!mcp||state.drafting)return;
  var list=dueMine().filter(function(l){if(channelOf(l)!=='email'||l.drafted)return false;var m=mergeEmail(l);return m&&!emailChecks(l,m).some(function(c){return c.stop;});});
  var cap=COLD_CAP-coldSentToday();
  var coldN=0;list=list.filter(function(l){var m=mergeEmail(l);if(!m.cold)return true;coldN++;return coldN<=Math.max(cap,0);});
  if(!list.length){toast('Nothing to draft: each due email needs proof, or today’s cold limit is reached.');return;}
  state.drafting=true;render();
  var k=0,ok=0;
  (function next(){
    if(k>=list.length){state.drafting=false;toast(ok+' draft'+(ok===1?'':'s')+' saved in Gmail. Send them there, then mark each one sent.');render();return;}
    var l=list[k++];
    createDraft(l,mergeEmail(l)).then(function(){ok++;},function(e){if(e&&['server_not_connected','needs_reauth','not_in_manifest','approval_required'].indexOf(e.code)>=0){k=list.length;mcpFail(e,'Gmail');}})
      .then(function(){return sleep(400);}).then(next);
  })();
}
function mcpFail(e,server){
  var c=e&&e.code;
  if(c==='server_not_connected')toast('Add the '+server+' connector in claude.ai Settings, then try again.');
  else if(c==='needs_reauth')toast('Reconnect '+server+' in claude.ai Settings → Connectors.');
  else if(c==='not_in_manifest'||c==='approval_required')toast('This page needs your OK to use '+server+'. Try again and allow it.');
  else toast(server+' did not answer. The draft may still exist: check Gmail before trying again.');
}
function readMail(){var m=Object.assign({},state.dr.mail||{});$$('#drawer [data-mail]').forEach(function(el){m[el.dataset.mail]=el.value;});state.dr.mail=m;return m;}

/* log save */
function saveLog(){
  var l=lead(state.open),d=state.dr.draft;if(!l)return;
  if(!d.outcome){toast('Pick what happened first.');return;}
  var note=(($('#d-note')||{}).value||d.note||'').trim();
  var patch={stage:stageAfter(l.stage,d.outcome)};
  if(d.outcome!=='note')patch.last=today();
  if(['no','bounced'].indexOf(d.outcome)>=0){patch.due='';patch.next='';}
  else{patch.due=d.due||'';patch.next=(d.next||'').trim();}
  if(d.outcome==='no'&&(($('#d-dnc')||{}).checked!==false))patch.dnc=true;
  if(d.outcome==='bounced'){patch.consent='';}
  var s=seqOf(l),st=stepOf(l);
  if(s){
    if(STOPS_SEQ.indexOf(d.outcome)>=0){patch.seq='';patch.step=0;patch.drafted='';}
    else if(st&&st.ch==='call'&&['no_answer','voicemail','gatekeeper'].indexOf(d.outcome)>=0){Object.assign(patch,seqPatchAdvance(l,false));}
  }
  addLog({lead:l.id,outcome:d.outcome,note:note});
  state.dr.logging=false;state.dr.draft={};
  save(l.id,patch).then(function(){toast('Logged.');rerender();});
  rerender();
}
function quickLog(id,o){
  var l=lead(id);if(!l)return;
  var out=lbl0(o),patch={stage:stageAfter(l.stage,o),last:today(),due:addDays(out.days||1)};
  var st=stepOf(l);if(st&&st.ch==='call')Object.assign(patch,seqPatchAdvance(l,false));
  addLog({lead:id,outcome:o,note:''});
  save(id,patch).then(function(){toast(out.l+' logged for '+titleOf(l)+'. Back '+dueLabel(patch.due).toLowerCase()+'.');render();});
  render();
}
function rerender(){render();if(state.open)renderDrawer();if(state.call)renderCall();}

}
function endCalls(){var n=state.call?state.call.done:0;state.call=null;$('#callmode').hidden=true;if(!state.open)document.body.classList.remove('locked');render();if(n)toast(n+' call'+(n===1?'':'s')+' logged. Nice work.');}

    (st?'<p class="soft" style="margin:4px 0 0;font-size:14px">'+esc(st.name)+' · '+esc((seqOf(l)||{}).name||'')+'</p>':'')+
    (l.say?'<div class="say" style="margin:16px 0">'+esc(l.say)+'</div>':'')+
    (logs.length?'<p class="faint" style="font-size:13px;margin:0 0 14px">Last: '+logs.map(function(x){return esc(niceDate(x.date)+' — '+lbl(OUTCOMES,x.outcome)+(x.note?': '+x.note:''));}).join(' · ')+'</p>':'')+
    '<div class="outcomes" role="group" aria-label="What happened">'+OUTCOMES.filter(function(o){return !o.hide&&o.k!=='note';}).map(function(o){return '<button type="button" class="chip" data-act="c-out" data-v="'+o.k+'" aria-pressed="'+(d.outcome===o.k)+'"><span class="kbd">'+o.key+'</span> '+esc(o.l)+'</button>';}).join('')+'</div>'+

    '<div class="row-actions" style="margin-top:16px"><button type="button" class="btn primary" data-act="c-save"'+(d.outcome?'':' disabled')+'>Save and next <span class="kbd" style="color:inherit;border-color:currentColor">Enter</span></button>'+
    '<button type="button" class="btn ghost" data-act="c-skip">Skip</button><button type="button" class="btn ghost" data-act="open" data-id="'+esc(l.id)+'">Open lead</button></div></div>';
  $('#callmode').innerHTML=h;
}
function callSave(){
  var c=state.call;if(!c||!c.draft.outcome)return;
  var l=lead(c.ids[c.i]);if(!l)return;
  var o=c.draft.outcome,out=lbl0(o),note=(($('#c-note')||{}).value||'').trim(),due=(($('#c-due')||{}).value)||c.draft.due;
  var patch={stage:stageAfter(l.stage,o),last:today()};
  if(o==='no'){patch.due='';patch.next='';patch.dnc=true;}
  else{patch.due=due||(typeof out.days==='number'?addDays(out.days):'');patch.next=o==='meeting'?'Meeting: demo and install the calculator':(l.next||'Follow up');}
  if(l.seq){
    if(STOPS_SEQ.indexOf(o)>=0){patch.seq='';patch.step=0;}
    else{var st=stepOf(l);if(st&&st.ch==='call'){var adv=seqPatchAdvance(l,false);if(!due)Object.assign(patch,adv);else{patch.step=adv.step;patch.next=adv.next;if(adv.seq==='')patch.seq='';}}}
  }
  addLog({lead:l.id,outcome:o,note:note});
  save(l.id,patch);
  c.done++;c.i++;c.draft={};renderCall();
}

var imp=null;

  phone:/^(phone|tel|téléphone|telephone)/i,email:/^(e-?mail|courriel)/i,web:/^(web|website|site|url|domain)/i,city:/^(city|ville)/i,prov:/^(prov|province|state|region)/i,address:/^(address|adresse|street|rue)/i,notes:/^(note)/i};
function parseCSV(t){
  var rows=[],row=[],f='',q=false;t=t.replace(/\r\n?/g,'\n');
  var sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':(t.indexOf('\t')>=0&&t.split('\n')[0].indexOf(',')<0?'\t':',');
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===sep){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}

function buildImport(){
  var body=imp.rows.slice(1),ix=inCrmIndex(),seen={};

    if(!o.clinic&&!o.contact)return null;
    var key=(o.email||'').toLowerCase()||domain(o.web)||digits(o.phone)||norm(o.clinic);
    var dup=!!matchLead(ix,o)||!!seen[key];seen[key]=1;

  return {
    doc:function(path){
      var p=path.split('/'),col=p[0],id=p.slice(1).join('/');
      return {
        update:function(patch){
          if(col==='leads')return sb.from('crm_leads').update(cleanLead(patch)).eq('id',id).then(sbErr);
          return Promise.reject({code:'invalid_argument'});
        },
        set:function(data){
          if(col==='config')return sb.from('crm_config').upsert({k:id,v:data,updated_at:new Date().toISOString()}).then(sbErr);
          return Promise.reject({code:'invalid_argument'});
        },
        delete:function(){
          if(col==='leads')return sb.from('crm_leads').delete().eq('id',id).then(sbErr);
          return Promise.reject({code:'invalid_argument'});
        }
      };
    },
    collection:function(col){
      return {add:function(entry){
        if(col!=='log')return Promise.reject({code:'invalid_argument'});
        var row={lead:entry.lead,date:entry.date,ts:entry.ts,by:entry.by,by_id:state.meId,outcome:entry.outcome,note:entry.note||'',cold:!!entry.cold};
        return sb.from('crm_log').insert(row).then(sbErr);
      }};
    }
  };
}
function fetchAll(table,order){
  var out=[],size=1000;
  function page(from){
    var q=sb.from(table).select('*').range(from,from+size-1);
    if(order)q=q.order(order);
    return q.then(function(r){sbErr(r);out=out.concat(r.data);return r.data.length===size?page(from+size):out;});
  }
  return page(0);
}
function upsertLocal(list,row){for(var i=0;i<list.length;i++){if(list[i].id===row.id){list[i]=row;return;}}list.push(row);}
function removeLocal(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id){list.splice(i,1);return;}}}
var reTimer=null;
function rerenderSoon(){clearTimeout(reTimer);reTimer=setTimeout(function(){
  if(!typingIn('#main')&&$('#modal').hidden)render();else renderNav();
  if(state.open){if(!lead(state.open))closeLead();else if(!typingIn('#drawer'))renderDrawer();}
  if(state.call&&!typingIn('#callmode'))renderCall();
},120);}

function loadMembers(){
  return sb.from('crm_members').select('user_id,email,name,role,active,phone_lang,created_at').order('created_at').then(function(r){
    sbErr(r);state.members=r.data;
    OWNERS=r.data.filter(function(m){return m.active;}).map(function(m){return m.name;});
    state.leads.forEach(function(l){if(l.owner&&OWNERS.indexOf(l.owner)<0)OWNERS.push(l.owner);});
  });
}
function loadAll(){
  return Promise.all([
    fetchAll('crm_leads','id').then(function(rows){state.leads=rows;}),
    fetchAll('crm_log','ts').then(function(rows){state.log=rows;}),
    sb.from('crm_config').select('k,v').then(function(r){sbErr(r);r.data.forEach(function(c){if(c.k==='sequences'&&c.v&&Array.isArray(c.v.list))state.seqs=JSON.parse(JSON.stringify(c.v.list));});}),
    loadMembers(),
    canManage()?sb.rpc('crm_directory_counts').then(function(r){
      if(r.error||!r.data)return;var provs={},total=0;r.data.forEach(function(x){provs[x.prov]=+x.n;total+=+x.n;});state.poolMeta={provs:provs,total:total};
    }):Promise.resolve()
  ]);
}
function listen(){
  sb.channel('crm').on('postgres_changes',{event:'*',schema:'public',table:'crm_leads'},function(p){
    if(p.eventType==='DELETE'){removeLocal(state.leads,p.old.id);}else{upsertLocal(state.leads,p.new);}
    rerenderSoon();
  }).on('postgres_changes',{event:'*',schema:'public',table:'crm_log'},function(p){
    if(p.eventType==='DELETE'){removeLocal(state.log,p.old.id);}
    else{state.log=state.log.filter(function(x){return !(String(x.id).indexOf('tmp')===0&&x.lead===p.new.lead&&x.ts===p.new.ts);});upsertLocal(state.log,p.new);}
    rerenderSoon();
  }).on('postgres_changes',{event:'*',schema:'public',table:'crm_config'},function(p){
    if(p.new&&p.new.k==='sequences'&&p.new.v&&Array.isArray(p.new.v.list)){state.seqs=JSON.parse(JSON.stringify(p.new.v.list));rerenderSoon();}
  }).subscribe();
  /* a refresh when the tab comes back, in case a live update was missed */
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state.loaded)loadAll().then(rerenderSoon,function(){});});
}

/* ================= login ================= */
function showGate(msg){$('#gate').hidden=false;var e=$('#li-err');if(msg){e.textContent=msg;e.hidden=false;}else e.hidden=true;setTimeout(function(){var f=$('#li-email');if(f&&!f.value)f.focus();},30);}
function enter(session){
  var u=session.user;
  return sb.from('crm_members').select('user_id,email,name,role,active').eq('user_id',u.id).maybeSingle().then(function(r){
    if(r.error||!r.data||!r.data.active){sb.auth.signOut();showGate(r.data&&!r.data.active?'This account is turned off. Ask Hamza.':'This account isn’t on the SSS team yet. Ask Hamza.');return;}
    var m=r.data;
    state.me=m.name;state.meEmail=m.email;state.meId=m.user_id;state.role=m.role;
    state.meFull=(u.user_metadata&&u.user_metadata.full_name)||m.name;
    $('#gate').hidden=true;
    db=makeDb();
    fromHash();
    return loadAll().then(function(){state.loaded=true;render();listen();},function(){$('#view').innerHTML='<p class="empty">The leads did not load. Reload the page to try again.</p>';});
  });
}
$('#login').addEventListener('submit',function(e){
  e.preventDefault();
  var b=$('#li-go');b.disabled=true;b.textContent='Signing in…';
  sb.auth.signInWithPassword({email:$('#li-email').value.trim(),password:$('#li-pw').value}).then(function(r){
    b.disabled=false;b.textContent='Sign in';
    if(r.error){showGate(r.error.status===400?'Wrong email or password.':'Sign-in did not work. Check your connection and try again.');return;}
    $('#li-pw').value='';enter(r.data.session);
  });
});

/* ================= account ================= */
function openAccount(){
  modal('<span class="caps faint">'+esc(roleLabel(state.role))+'</span><h2>'+esc(state.me)+'</h2><p class="soft" style="margin:0 0 16px">'+esc(state.meEmail)+'</p>'+
    '<div class="row-actions"><button type="button" class="btn" data-act="pw-open">Change password</button><button type="button" class="btn ghost" data-act="signout">Sign out</button><button type="button" class="btn ghost" data-act="modal-close">Close</button></div>');
}
function openPw(){
  modal('<h2>Change your password</h2><p class="soft" style="margin:0 0 14px;font-size:14px">At least 10 characters. A short sentence is easiest to remember.</p>'+
    '<div class="grid-form"><label class="f">New password<input type="password" id="pw1" autocomplete="new-password"></label><label class="f">Type it again<input type="password" id="pw2" autocomplete="new-password"></label>'+
    '<div class="row-actions"><button type="button" class="btn primary" data-act="pw-save">Save password</button><button type="button" class="btn ghost" data-act="modal-close">Cancel</button></div></div>');
}
function savePw(){
  var a=$('#pw1').value,b=$('#pw2').value;
  if(a.length<10){toast('Use at least 10 characters.');return;}
  if(a!==b){toast('The two passwords are different.');return;}
  sb.auth.updateUser({password:a}).then(function(r){if(r.error){toast('That did not save: '+r.error.message);return;}closeModal();toast('Password changed.');});
}

/* ================= TEAM (admin) ================= */
function genPw(){var c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(12);crypto.getRandomValues(a);var s='';for(var i=0;i<12;i++){s+=c[a[i]%c.length];if(i===3||i===7)s+='-';}return s;}
function adminCall(body){
  return sb.auth.getSession().then(function(r){
    var tok=r.data&&r.data.session&&r.data.session.access_token;
    return fetch(SB_URL+'/functions/v1/crm-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':SB_KEY},body:JSON.stringify(body)})
      .then(function(res){return res.json().then(function(j){if(!res.ok||j.error)throw j;return j;});});
  });
}
function renderTeam(){
  if(!isAdmin()){$('#view').innerHTML='<p class="empty">Only admins manage the team.</p>';return;}
  var h=head('Access','Team','Everyone who can sign in to Prospects. Callers see only the leads assigned to them; managers and admins see everything.',
    '<button type="button" class="btn primary" data-act="team-add">'+ic('i-plus')+'Add a person</button>');
  h+='<div class="card">'+state.members.map(function(m){
    var mine=count(state.leads,function(l){return l.owner===m.name&&isOpen(l);});
    var calls=count(state.log,function(x){return x.by===m.name&&['no_answer','voicemail','gatekeeper','interested','meeting','later','no'].indexOf(x.outcome)>=0&&x.date===today();});
    var self=m.user_id===state.meId;
    return '<div class="team-row"><div><b style="font-weight:600">'+esc(m.name)+'</b>'+(m.active?'':' <span class="tag warn">Turned off</span>')+'<div class="faint" style="font-size:13px">'+esc(m.email)+'</div></div>'+
      '<div class="soft" style="font-size:13.5px">'+mine+' open lead'+(mine===1?'':'s')+' · '+calls+' call'+(calls===1?'':'s')+' logged today</div>'+
      '<div>'+(self?'<span class="tag">'+esc(roleLabel(m.role))+'</span>':'<select data-team-role="'+esc(m.user_id)+'" aria-label="Role for '+esc(m.name)+'">'+['caller','manager','admin'].map(function(r){return '<option value="'+r+'"'+(m.role===r?' selected':'')+'>'+roleLabel(r)+'</option>';}).join('')+'</select>')+'</div>'+
      '<div class="row-actions" style="justify-content:flex-end">'+(self?'':'<button type="button" class="btn small" data-act="team-reset" data-id="'+esc(m.user_id)+'">New password</button>'+
        '<button type="button" class="btn small ghost'+(m.active?' danger':'')+'" data-act="team-toggle" data-id="'+esc(m.user_id)+'" data-v="'+(m.active?'0':'1')+'">'+(m.active?'Turn off':'Turn on')+'</button>')+'</div></div>';
  }).join('')+'</div>';
  h+='<p class="faint" style="font-size:13px;margin-top:14px">Leads are assigned by name: a caller sees every lead whose owner is their name. Assign them from the Pipeline (select leads, then Assign to).</p>';
  $('#view').innerHTML=h;
}
var teamDraft=null;
function openTeamAdd(){
  teamDraft={pw:genPw()};
  modal('<span class="caps faint">Team</span><h2>Add a person</h2><p class="soft" style="margin:0 0 14px;font-size:14px">They sign in with this email and the temporary password, then change it under their name.</p>'+
    '<div class="grid-form"><div class="two"><label class="f">First name, as it shows on leads<input type="text" id="tm-name" placeholder="Khadija"></label><label class="f">Full name, for email signatures<input type="text" id="tm-full" placeholder="Khadija Lastname"></label></div>'+
    '<label class="f">Email<input type="email" id="tm-email" placeholder="khadija@sss.marketing"></label>'+
    '<div class="two"><label class="f">Role<select id="tm-role"><option value="caller">Caller: their own leads only</option><option value="manager">Manager: every lead</option><option value="admin">Admin: everything, plus the team</option></select></label>'+
    '<label class="f">Calls in<select id="tm-lang"><option>FR</option><option>EN</option></select></label></div>'+
    '<div><div class="caps faint" style="margin-bottom:6px">Temporary password</div><div class="pw">'+esc(teamDraft.pw)+'</div></div>'+
    '<div class="row-actions"><button type="button" class="btn primary" data-act="team-create">Create the account</button><button type="button" class="btn ghost" data-act="modal-close">Cancel</button></div></div>');
}
function teamCreate(){
  var name=$('#tm-name').value.trim(),full=$('#tm-full').value.trim(),email=$('#tm-email').value.trim(),role=$('#tm-role').value,lang=$('#tm-lang').value;
  if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Add a first name and a valid email.');return;}
  if(state.members.some(function(m){return m.name.toLowerCase()===name.toLowerCase();})){toast('Someone already uses that name. Add an initial.');return;}
  var b=$('[data-act="team-create"]');b.disabled=true;b.textContent='Creating…';
  adminCall({action:'create',email:email,name:name,full_name:full||name,role:role,lang:lang,password:teamDraft.pw}).then(function(){
    return loadMembers().then(function(){
      modal('<h2>'+esc(name)+' can sign in</h2><p class="soft" style="margin:0 0 12px">Send them these, by text or in person:</p>'+
        '<div class="grid-form" style="margin-top:0"><div><div class="caps faint" style="margin-bottom:6px">Page</div><div class="pw">sss.marketing/crm</div></div>'+
        '<div><div class="caps faint" style="margin-bottom:6px">Email</div><div class="pw">'+esc(email)+'</div></div>'+
        '<div><div class="caps faint" style="margin-bottom:6px">Temporary password</div><div class="pw">'+esc(teamDraft.pw)+'</div></div>'+
        '<div class="row-actions"><button type="button" class="btn" data-act="copy" data-v="'+esc('sss.marketing/crm\n'+email+'\n'+teamDraft.pw)+'">'+ic('i-copy')+'Copy all three</button><button type="button" class="btn primary" data-act="modal-close">Done</button></div></div>');
      render();
    });
  },function(e){b.disabled=false;b.textContent='Create the account';
    toast(e&&e.detail&&/already/i.test(e.detail)?'That email already has an account.':'The account was not created'+(e&&e.error?' ('+e.error+')':'')+'.');});
}
function teamReset(uid){
  var m=state.members.filter(function(x){return x.user_id===uid;})[0];if(!m)return;
  var pw=genPw();
  adminCall({action:'reset',user_id:uid,password:pw}).then(function(){
    modal('<h2>New password for '+esc(m.name)+'</h2><p class="soft" style="margin:0 0 12px">Their old password stops working now. Send them this one; they change it after signing in.</p>'+
      '<div class="pw">'+esc(pw)+'</div><div class="row-actions" style="margin-top:14px"><button type="button" class="btn" data-act="copy" data-v="'+esc(pw)+'">'+ic('i-copy')+'Copy</button><button type="button" class="btn primary" data-act="modal-close">Done</button></div>');
  },function(){toast('The password was not changed. Try again.');});
}
function teamUpdate(uid,patch){
  adminCall(Object.assign({action:'update',user_id:uid},patch)).then(function(){return loadMembers();}).then(function(){toast('Saved.');render();},function(e){toast(e&&e.error==='cannot_demote_self'?'You can’t remove your own admin access.':'That did not save.');render();});
}
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.teamRole){teamUpdate(t.dataset.teamRole,{role:t.value});}});

/* ================= start ================= */
function start(){
  if(!window.supabase||!window.supabase.createClient){$('#gate').hidden=true;$('#view').innerHTML='<p class="empty">Prospects could not load. Check your connection and reload the page.</p>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sss-crm-auth'}});
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(s)enter(s);else showGate();
  });
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){state.loaded=false;showGate();}});
}
start();
})();
</script>
